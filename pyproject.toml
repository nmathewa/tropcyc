[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tropcyc"
dynamic = ["version"]
description = "Machine-learning tropical cyclone intensity forecasts, built on tropycal"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nirmal Mathew Alex" }]
keywords = ["tropical cyclone", "hurricane", "intensity", "machine learning", "tropycal", "era5"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "tropycal>=1.3",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
]

[project.optional-dependencies]
era5 = ["xarray>=2023.1", "zarr>=2.16", "gcsfs>=2023.6"]
gfs = ["xarray>=2023.1", "cfgrib>=0.9.10", "eccodes>=1.7"]
cnn = ["torch>=2.2"]
plot = ["matplotlib>=3.7"]
server = ["fastapi>=0.110", "uvicorn>=0.29", "joblib>=1.3"]
test = ["pytest>=7.0", "httpx>=0.27"]
all = ["tropcyc[era5,gfs,cnn,plot,server]"]
dev = ["tropcyc[all,test]", "ruff>=0.4"]

[project.scripts]
tropcyc = "tropcyc.cli:main"

[project.urls]
Homepage = "https://github.com/nmathewa/tropcyc"
Issues = "https://github.com/nmathewa/tropcyc/issues"

[tool.hatch.version]
path = "src/tropcyc/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tropcyc"]

[tool.hatch.build.targets.sdist]
exclude = ["/data", "/models", "/runs"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# inline SVG markup and fixed-width TC vitals records read better unwrapped
"src/tropcyc/sitegen.py" = ["E501"]
"tests/test_tcvitals.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
